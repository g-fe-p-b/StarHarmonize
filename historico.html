<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Histórico · Clínica Star Harmonize</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a class="marca" href="painel.html"><img src="assets/logo-icone.png" alt="" width="44" height="44"><h1>Clínica Star Harmonize</h1></a>
    <nav><a href="painel.html">Agenda</a><a href="estoque.html">Estoque</a><a href="historico.html" aria-current="page">Histórico</a><a href="financeiro.html">Financeiro</a><a href="#" id="sair">Sair</a></nav>
  </header>
  <main style="grid-template-columns:1fr">
    <section aria-labelledby="t-f">
      <h2 id="t-f">Período</h2>
      <div class="filtros">
        <div class="grupo">
          <button class="sec" data-modo="dia" aria-pressed="false">Dia</button>
          <button class="sec" data-modo="semana" aria-pressed="false">Semana</button>
         <button class="sec" data-modo="mes" aria-pressed="true">Mês</button>
        </div>
        <div class="grupo">
          <button class="sec" id="ant" aria-label="Período anterior">‹</button>
          <button class="sec" id="hoje">Hoje</button>
          <button class="sec" id="prox" aria-label="Próximo período">›</button>
        </div>
        <strong id="rotulo"></strong>
      </div>
      <div class="resumo" id="resumo"></div>
    </section>
    <div class="grade-hist">
     <section aria-labelledby="t-p"><h2 id="t-p">Procedimentos mais feitos</h2><div class="barras" id="b-proc"></div></section>
     <section aria-labelledby="t-r"><h2 id="t-r">Por região do corpo</h2><div class="barras" id="b-regiao"></div></section>
     <section aria-labelledby="t-i"><h2 id="t-i">Por faixa etária</h2><div class="barras" id="b-idade"></div></section>
     <section aria-labelledby="t-l"><h2 id="t-l">Atendimentos do período</h2><div id="lista"></div></section>
    </div>
  </main>
<script type="module" src="js/historico.js"></script>
</body>
</html>
