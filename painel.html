<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Agenda · Clínica Star Harmonize</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Jost:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <a class="marca" href="painel.html"><img src="assets/logo-icone.png" alt="" width="44" height="44"><h1>Clínica Star Harmonize</h1></a>
  <nav><a href="painel.html" aria-current="page">Agenda</a><a href="estoque.html">Estoque</a><a href="historico.html">Histórico</a><a href="#" id="sair">Sair</a></nav>
</header>
<main>
  <section aria-labelledby="t-pend"><h2 id="t-pend">Aguardando confirmação</h2><p class="dica">Arraste o pedido até um horário na agenda, ou clique nele e depois no horário desejado.</p><div id="pendentes"></div></section>
  <section aria-labelledby="t-cal"><h2 id="t-cal">Calendário</h2>
    <div class="barra">
      <button class="sec" id="ant" aria-label="Mês anterior">‹</button><strong id="mes"></strong>
      <button class="sec" id="prox" aria-label="Próximo mês">›</button>
    </div>
    <div class="cal" id="cal"></div>
  </section>
  <section class="larga" aria-labelledby="t-ag">
    <div class="barra">
      <h2 id="t-ag" style="margin:0">Agenda</h2>
      <div class="grupo">
        <button class="sec" id="v-dia" aria-pressed="false">Dia</button>
        <button class="sec" id="v-semana" aria-pressed="true">Semana</button>
      </div>
      <div class="grupo">
        <button class="sec" id="g-ant">Anterior</button>
        <button class="sec" id="g-hoje">Hoje</button>
        <button class="sec" id="g-prox">Próximo</button>
      </div>
    </div>
    <p class="aviso" id="aviso" role="status" aria-live="polite"></p>
    <div class="resumo" id="resumo"></div>
    <div class="legenda">
      <span><i class="l ocupado"></i>Confirmado</span>
      <span><i class="l aguardando"></i>Aguardando</span>
      <span><i class="l folga"></i>Intervalo de 30 min</span>
      <span><i class="l livre"></i>Livre</span>
    </div>
    <div class="g-wrap"><div class="g-in" id="grade"></div></div>
  </section>
</main>
<script type="module" src="js/painel.js"></script>
</body>
</html>
